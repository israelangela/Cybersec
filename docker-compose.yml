services:
  postgres:
    image: postgres:latest
    container_name: cybersec-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cybersec}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cybersec_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-cybersec}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - cybersec_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cybersec} -d ${POSTGRES_DB:-cybersec}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: cybersec-backend
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://cybersec:cybersec_dev_password@postgres:5432/cybersec}
      BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS:-["http://localhost:3000","http://127.0.0.1:3000"]}
      COLLECTOR_SCHEDULER_ENABLED: ${COLLECTOR_SCHEDULER_ENABLED:-false}
      COLLECTOR_INTERVAL_MINUTES: ${COLLECTOR_INTERVAL_MINUTES:-30}
      COLLECTOR_REQUEST_TIMEOUT_SECONDS: ${COLLECTOR_REQUEST_TIMEOUT_SECONDS:-20}
      COLLECTOR_MAX_RESPONSE_BYTES: ${COLLECTOR_MAX_RESPONSE_BYTES:-5000000}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    container_name: cybersec-frontend
    restart: unless-stopped
    environment:
      INTERNAL_API_URL: http://backend:8000
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  cybersec_postgres_data:
